project:
  name: moringa-selective-radioprotection
  random_seed: 42

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  figures: results/figures
  tables: results/tables
  models: results/models
  screening: results/screening
  logs: results/logs

molecular_features:
  fingerprint: morgan
  radius: 2
  n_bits: 2048
  use_chirality: true

validation:
  split_method: seeded_scaffold_group_candidates
  train_fraction: 0.80
  validation_fraction: 0.10
  test_fraction: 0.10

assay_boundaries:
  mcf7_lower: 4.0
  du145_lower: 4.0
  mcf7_upper: 8.0
  du145_upper: 8.0

duplicate_absolute_discordance_threshold: 1.0
duplicate_secondary_zscore_discordance_threshold: 1.0

reconstruction_error_thresholds:
  gt_0_25: 0.25
  gt_0_50: 0.50
  gt_1: 1.0

cancer_baseline:
  frozen_cohort_size: 20047
  frozen_split_counts:
    train: 16038
    validation: 2004
    test: 2005
  selection_metric: mae
  descriptor_elastic_net_max_iter: 20000
  fingerprint_elastic_net_max_iter: 20000
  candidate_grids:
    dummy:
      - {}
    ridge:
      - {alpha: 0.1}
      - {alpha: 1.0}
      - {alpha: 10.0}
      - {alpha: 100.0}
    elastic_net:
      - {alpha: 0.001, l1_ratio: 0.1}
      - {alpha: 0.001, l1_ratio: 0.5}
      - {alpha: 0.001, l1_ratio: 0.9}
      - {alpha: 0.01, l1_ratio: 0.1}
      - {alpha: 0.01, l1_ratio: 0.5}
      - {alpha: 0.01, l1_ratio: 0.9}
      - {alpha: 0.1, l1_ratio: 0.1}
      - {alpha: 0.1, l1_ratio: 0.5}
      - {alpha: 0.1, l1_ratio: 0.9}
    random_forest:
      - {n_estimators: 200, max_features: sqrt, min_samples_leaf: 1}
      - {n_estimators: 400, max_features: sqrt, min_samples_leaf: 1}
      - {n_estimators: 300, max_features: 0.5, min_samples_leaf: 1}
      - {n_estimators: 300, max_features: 0.5, min_samples_leaf: 3}
    extra_trees:
      - {n_estimators: 200, max_features: sqrt, min_samples_leaf: 1}
      - {n_estimators: 400, max_features: sqrt, min_samples_leaf: 1}
      - {n_estimators: 300, max_features: 0.5, min_samples_leaf: 1}
      - {n_estimators: 300, max_features: 0.5, min_samples_leaf: 3}
    xgboost:
      - {max_depth: 3, learning_rate: 0.05, n_estimators: 400, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 1, reg_lambda: 1.0}
      - {max_depth: 6, learning_rate: 0.05, n_estimators: 300, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 1, reg_lambda: 1.0}
      - {max_depth: 3, learning_rate: 0.10, n_estimators: 250, subsample: 1.0, colsample_bytree: 1.0, min_child_weight: 1, reg_lambda: 1.0}
      - {max_depth: 6, learning_rate: 0.10, n_estimators: 250, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 3, reg_lambda: 5.0}

targets:
  cancer_cell_lines:
    - MCF7
    - DU145

screening:
  library: COCONUT

nci:
  source_name: NIH/NCI CellMiner DTP direct download
  source_url: https://discover.nci.nih.gov/cellminer/loadDownload.do
  authority_notes:
    - "The authoritative NCI-60 response dataset for this project is the official CellMiner/NCI DTP direct-download archive."
    - "The acquisition stage uses the public NIH/NCI direct-download resources that are exposed by the CellMiner download pages."
  required_files:
    - local_filename: DTP_NCI60_ZSCORE.zip
      source_url: https://discover.nci.nih.gov/cellminer/download/processeddataset/DTP_NCI60_ZSCORE.zip
      required: true
      purpose: "Primary processed NCI-60 compound-response z-score dataset required for MCF-7 and DU145 modeling."
      notes: "Official NIH/NCI CellMiner direct download; save under data/raw/nci60/."
    - local_filename: NSC_QUERY_LIST.zip
      source_url: https://discover.nci.nih.gov/cellminerdata/download/NSC_QUERY_LIST.zip
      required: true
      purpose: "NSC identifier and PubChem mapping resource required to preserve provenance and match compounds to standard identifiers."
      notes: "Official NIH/NCI CellMiner direct download; save under data/raw/nci60/."
  optional_files:
    - local_filename: DTP_NCI60_RAW.zip
      source_url: https://discover.nci.nih.gov/cellminer/download/rawdataset/DTP_NCI60_RAW.zip
      required: false
      purpose: "Supplementary raw NCI-60 replicate activity data; useful for later QC and reproducibility checks but not required for initial preparation."
      notes: "Official NIH/NCI CellMiner direct download; optional for this acquisition stage."
