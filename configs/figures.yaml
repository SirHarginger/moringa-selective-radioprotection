# Publication figures from saved tables of one evaluated run (protocol §19; figure standards).
# Figures are write-once: bump `version` to regenerate. Captions are drafts, finalised
# from the run record in phase_05.
tables_dir: results/tables/primary_v1
output_dir: figures/generated
version: 1
dpi: 300
formats: [pdf, svg, png]
figures:
  - id: fig_01
    slug: observed_vs_predicted
    kind: observed_vs_predicted
    inputs: {oof: oof_predictions.csv}
    caption: >
      Observed CLARIFi mSF2 (literature-median clonogenic SF2 at 2 Gy) versus out-of-fold
      predictions averaged over cross-validation repeats, tissue-only (left) and
      tissue + 50 Hallmark scores (right). n = eligible lines; dashed line: identity.
  - id: fig_02
    slug: delta_mae
    kind: effect_forest
    inputs: {comparisons: comparisons.csv}
    options: {method: component_bootstrap}   # set to the adopted method after the simulation
    caption: >
      Paired component-weighted dMAE (positive: richer model better) with 90% intervals
      (method stated on the axis). n = components. Estimation only; no claim of
      biological or clinical meaningfulness.
  - id: fig_03
    slug: tissue_errors
    kind: tissue_errors
    inputs: {errors: tissue_errors.csv}
    caption: >
      Component-weighted out-of-fold MAE per OncotreeLineage (n components per lineage),
      tissue-only vs tissue + expression. Descriptive.
  - id: fig_s01
    slug: repeat_variability
    kind: repeat_distribution
    inputs: {per_repeat: per_repeat_delta_mae.csv}
    options: {comparison: "primary: tissue+expression vs tissue"}
    caption: >
      dMAE of each cross-validation repeat (split variability, not sampling uncertainty).
  - id: fig_s02
    slug: gene_set_stability
    kind: stability_vs_null
    inputs: {tests: explainability/gene_set_tests.csv}
    caption: >
      Mean grouped permutation importance of Hallmark scores; dark bars only where
      attribution is permitted (primary gain shown and BH q = 0.05 against both nulls).
      Associations in-model, hypothesis-generating.
  - id: fig_s03
    slug: moringa_context_lines
    kind: supplementary_case_lines
    inputs: {oof: oof_predictions.csv}
    options: {lines: {ACH-000019: MCF-7, ACH-000979: DU145}}
    caption: >
      Supplementary context only: MCF-7 and DU145 (lines of the motivating Moringa study)
      on the solid-tumour mSF2 distribution, observed vs out-of-fold predicted. No claim
      about extracts, proliferation enhancement factor, radioprotection or wound healing.
      DU145 has a stranded RNA profile.
# Exploratory cross-assay figure (kind: cross_assay) is added once tier (c) exists (P01.08).
