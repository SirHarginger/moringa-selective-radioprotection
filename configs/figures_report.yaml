# Report figures, version 3 (Seaborn; shared theme in visualization/style.py).
#
# Output layout (scripts/make_report_figures.py):
#   figures/png/<id>_<slug>.png        600 dpi
#   figures/pdf/<id>_<slug>.pdf        vector
#   figures/metadata/<id>_<slug>.meta.json  + figure_index.csv
# PNG and PDF only; SVG is refused. Version-1 and version-2 figures in figures/generated/
# are untouched.
#
# Figures carry NO title, figure number, footnote or explanatory note: the captions below
# are the single source for the report, and make_report_figures.py copies each one into the
# figure's metadata sidecar and into reports/french_embassy/figure_manifest.csv.
#
# `report_label` is the number the figure carries in the report text.
# Every input path is relative to the repository root.

output_root: figures
version: 3
dpi: 600
formats: [png, pdf]

figures:

  - id: fig_01
    report_label: "Figure 1"
    slug: project_workflow
    kind: project_workflow
    data_provenance: conceptual_diagram
    caption: >
      Structure of the project, from the original Moringa oleifera radiobiology
      investigation to the prioritisation of candidate constituents for future
      experimental work. Box fills distinguish data sources, computational steps,
      literature curation and proposed future work; they do not indicate how strong the
      evidence at each stage is. The Moringa measurements are the biological motivation
      only: they are never used as training, calibration or validation data, because
      crystal-violet proliferation under extract treatment and clonogenic survival at 2 Gy
      are different endpoints. Stage 6 is a proposal, not completed work.

  - id: fig_02
    report_label: "Figure 2"
    slug: dataset_composition
    kind: dataset_overview
    data_provenance: empirical
    inputs:
      oof: results/tables/primary_v1/oof_predictions.csv
    options:
      min_components: 10
      context_lines: {ACH-000019: MCF-7, ACH-000979: DU145}
    caption: >
      Composition and radiosensitivity of the analysed cohort (241 eligible records,
      237 independent biological components). (a) Independent components per tissue
      (OncotreeLineage); the dashed line marks the ten-component threshold above which a
      tissue formed its own cross-validation stratum. (b) Distribution of observed CLARIFi
      mSF2, the literature-median clonogenic surviving fraction at 2 Gy, with one point per
      independent component so that related cell lines count once; tissues with fewer than
      ten components are pooled. Boxes show the median and interquartile range; whiskers
      extend to 1.5 times the interquartile range. Open diamonds mark MCF-7 and DU145, two
      of the three lines used in the motivating Moringa study, shown as context only: no
      statement about Moringa extracts or radioprotection is made or implied. V79 is a
      Chinese hamster line and has no counterpart in this human cohort.

  - id: fig_03
    report_label: "Figure 3"
    slug: model_performance
    kind: model_performance
    data_provenance: empirical
    inputs:
      metrics: results/tables/primary_v1/model_metrics.csv
      per_repeat: results/tables/primary_v1/per_repeat_delta_mae.csv
      comparisons: results/tables/primary_v1/comparisons.csv
    caption: >
      Out-of-fold predictive performance of the five prespecified models (M0 global mean,
      M1 tissue only, M1P tissue and proliferation, M2 tissue and 50 Hallmark expression
      scores, M2P tissue, proliferation and expression). (a) Component-weighted mean
      absolute error, in mSF2 units, with bars starting at zero. (b) Out-of-sample R-squared,
      where zero corresponds to predicting the training-set mean; every model lies close to
      zero, so none explains much of the variation between cell lines. (c) Paired
      difference in MAE in each of the ten cross-validation repeats for the primary
      comparison (M2 against M1) and the proliferation-adjusted sensitivity comparison (M2P
      against M1P); positive values favour the richer model. The thick vertical bar is the
      pooled estimate, the mean over repeats. The upper axis expresses the same difference
      as a percentage of MAE(M1). Repeats re-split the same 237 components, so their spread
      shows split-to-split variability, not sampling uncertainty; no interval is shown
      because no interval method was validated for this design. All values are
      component-weighted out-of-fold values from ten repeats of five-fold cross-validation
      grouped by biological component and stratified by tissue, with all tuning and scaling
      inside training folds. Descriptive only: superiority was not formally assessed and
      negative-control draws were not run.

  - id: fig_04
    report_label: "Figure 4"
    slug: prediction_behaviour
    kind: prediction_behaviour
    data_provenance: empirical
    inputs:
      oof: results/tables/primary_v1/oof_predictions.csv
    options:
      models: [M1, M2]
    caption: >
      Why the out-of-sample R-squared stays near zero. (a, b) Observed against out-of-fold
      predicted mSF2 for the tissue-only model M1 and the tissue-plus-expression model M2.
      Each point is one independent biological component; records of a component are
      averaged and each record's prediction is already the mean over the ten
      cross-validation repeats, so no cell line contributes more than one point. The dashed
      line is the identity; both axes span the full possible range of the endpoint. (c)
      Empirical cumulative distributions of the observed values and of the predictions of
      both models. The predictions of both models occupy a narrow band near the cohort
      mean while the observations span almost the whole interval, which is the behaviour of
      a model with little usable signal rather than of a miscalibrated one. No trend line is
      fitted. Descriptive only.

  - id: fig_05
    report_label: "Figure 5"
    slug: tissue_performance
    kind: tissue_performance
    data_provenance: empirical
    inputs:
      errors: results/tables/primary_v1/tissue_errors.csv
    options:
      min_components: 10
    caption: >
      Performance by tissue of origin, for the nine tissues with at least ten independent
      components; the number of components is given beside each tissue name. (a)
      Component-weighted out-of-fold MAE of each model, in mSF2 units; lighter cells are
      lower error. (b) The difference MAE(M1) minus MAE(M2) for the same tissues, in the
      same row order; positive values (blue) mean the expression model had the lower error.
      Differences are small relative to the errors themselves and are descriptive only: they
      come from one cross-validated run, no per-tissue inference was performed, and tissues
      with fewer than ten components are omitted here because their estimates are unstable.

  - id: fig_06
    report_label: "Figure 6"
    slug: gene_set_importance
    kind: gene_set_importance
    data_provenance: empirical
    inputs:
      table_s2: results/tables/primary_v1/publication_triage_v1/table_s2_gene_set_ranking.csv
      importance_per_task: results/tables/primary_v1/explainability/importance_per_task.csv
    options:
      top: 15
      exploratory_share: 0.5
      max_share_zero: 0.5
    caption: >
      Exploratory importance of the Hallmark gene-set scores in the expression model M2.
      (a) The fifteen highest-ranked gene sets. Grey points are the grouped permutation
      importance in each of the fifty model fits (ten repeats by five folds), computed on
      held-out rows only as the increase in component-weighted MAE when a score is permuted
      across components; the diamond is the mean over fits, coloured by the prespecified
      triage tier. The spread across fits is split-to-split variability, not a confidence
      interval. (b) The two criteria that define tier C, for all fifty gene sets: the share
      of fits in which importance exceeded zero, and the share of fits in which the set
      received a non-zero coefficient. The shaded corner is the region satisfying both
      thresholds (dashed lines, 0.50 each), as frozen in configs/triage.yaml. Tiers A and B
      were unreachable by design: they require a formally demonstrated prediction gain and
      at least 1000 negative-control draws, and neither exists in this run. Shares are
      proportions of overlapping cross-validation fits, not probabilities or p-values.
      These rankings describe one fitted model family on one dataset. They are not validated
      biomarkers, causal mechanisms, radiation-response pathways, or molecular effect sizes,
      and correlated gene-set scores can share or exchange importance.

  - id: fig_07
    report_label: "Figure 7"
    slug: cell_line_discrepancies
    kind: cell_line_discrepancies
    data_provenance: empirical
    inputs:
      table_s3: results/tables/primary_v1/publication_triage_v1/table_s3_discrepancy_review.csv
    options:
      context_lines: {ACH-000019: MCF-7, ACH-000979: DU145}
      matrix_tiers: [A, B]
    caption: >
      Cell lines whose measured radiosensitivity the model reproduces least well. (a)
      Residual (observed minus predicted mSF2 under M2, predictions averaged over repeats)
      against the observed value, for every measured line, coloured by prespecified
      discrepancy tier; triangles mark lines carrying at least one technical flag. The
      strong dependence of the residual on the observed value is shrinkage: because the
      models predict close to the cohort mean, lines with extreme measured values
      necessarily have the largest residuals. Circled points are MCF-7 and DU145, labelled
      because of their relevance to the motivating study; their tiers are not altered. (b)
      Flags recorded for the tier A and tier B lines, in rank order: flags concerning
      prediction behaviour (instability across repeats, disagreement between M1 and M2) are
      distinguished from flags concerning the data or the cell-line identity (stranded RNA
      profile, related lines in the cohort, a Cellosaurus problem flag on a relative, small
      tissue group). Tier thresholds are cohort percentiles, so a flag means "relatively
      large in this cohort", not "abnormal". These are measured CLARIFi lines used in model
      development, not independent validation samples; a large residual is a signal to
      re-check identity, data provenance and the original measurement, and is not evidence
      of unusual radiobiology, radioprotection or radiosensitisation. Lines selected for
      extreme residuals are expected to agree better on re-measurement even if nothing is
      wrong (regression to the mean).

  - id: fig_08
    report_label: "Figure 8"
    slug: compound_priority
    kind: compound_scorecard
    data_provenance: empirical
    inputs:
      ranking: results/tables/primary_v1/compounds_v1/table_c3_candidate_ranking.csv
    options:
      include_not_prioritised: true
    caption: >
      Evidence-based prioritisation of documented Moringa oleifera seed and leaf
      constituents for future experimental work. (a) Points awarded in each of the four
      prespecified dimensions (numbers are the points; shading is the fraction of that
      dimension's maximum), beside the extraction-specific evidence: whether the compound
      has been identified in a dichloromethane extract or fraction of seed or leaf, in
      seed or leaf with another solvent, or only indirectly. (b) Total priority score out of
      eight, coloured by tier. The extraction column is deliberately kept outside the score,
      because the original study used dichloromethane extracts whose composition was never
      measured. Scoring rules were fixed before any score was computed
      (docs/compound_protocol.md): only primary studies of the purified compound score,
      chemical-class analogy earns nothing, several papers from one research group count as
      one source, a compound with no primary Moringa identification is not assessable, and
      evidence that a compound protects tumour cells from radiation or is itself genotoxic
      caps the tier at C. Every tier, including A, is hypothesis-generating: no tier asserts
      radioprotection, radiosensitisation, potency, or any effect of the extracts used in
      the original study.

  - id: fig_09
    report_label: "Figure 9"
    slug: compound_evidence_map
    kind: compound_evidence_map
    data_provenance: empirical
    inputs:
      evidence: results/tables/primary_v1/compounds_v1/table_c2_biology_evidence.csv
      ranking: results/tables/primary_v1/compounds_v1/table_c3_candidate_ranking.csv
      overlap: results/tables/primary_v1/compounds_v1/table_c4_pathway_overlap.csv
    caption: >
      What the published evidence actually links each shortlisted compound to. (a)
      Radiation-response processes for which a primary study of the purified compound
      exists: symbol size is the number of independent research groups, and colour
      distinguishes studies using ionising radiation from studies of the same process
      without radiation. Compounds are in priority order. An empty row means no qualifying
      primary study was located, which is a gap in the literature, not evidence of no
      effect. (b) Where recorded, the number of genes a published experiment measured for
      the compound that are also members of a Hallmark gene set ranked by the exploratory
      explainability analysis; blank cells mean no overlap was recorded. Such an overlap
      marks a point where a compound and a model-highlighted gene set touch the same genes.
      It is a hypothesis to be tested, not evidence that the compound modifies the gene set,
      the pathway or clonogenic SF2, and the gene-set ranking it refers to was itself capped
      at tier C. Reported directions (protection or sensitisation, and the cell type
      involved) are given in Table C2 and are never merged.

  - id: fig_s01
    report_label: "Figure S1"
    slug: prediction_variability
    kind: prediction_variability
    data_provenance: empirical
    inputs:
      oof: results/tables/primary_v1/oof_predictions.csv
    caption: >
      Stability of each cell line's out-of-fold prediction across the ten cross-validation
      repeats, by model: the distribution over records of the standard deviation of the
      prediction. Violins show the kernel density over all 241 records with the quartiles
      marked; the quantity is split-to-split variability of the prediction and is not a
      prediction interval or a confidence interval, and it widens with the number of
      repeats. The expression models vary more between splits than the tissue-only models,
      whose prediction is a shrunken tissue mean.

  - id: fig_s02
    report_label: "Figure S2"
    slug: gene_set_correlation
    kind: gene_set_correlation
    data_provenance: empirical
    inputs:
      table_s2: results/tables/primary_v1/publication_triage_v1/table_s2_gene_set_ranking.csv
      correlation: results/tables/primary_v1/explainability/gene_set_score_correlation.csv
    options:
      tiers: [C]
    caption: >
      Spearman correlation between the Hallmark gene-set scores of the tier-C sets and of
      every set flagged as sharing signal with them (absolute correlation at least 0.80),
      computed over the eligible cell lines from the expression features alone. Rows and
      columns follow the triage rank order; no clustering is applied, so no grouping here
      should be read as a biological relationship. Correlated scores can share or exchange
      permutation importance, so neighbouring sets in Figure 6 are not independent
      findings.
