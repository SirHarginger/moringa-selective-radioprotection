# Compound-to-biology evidence: primary experimental studies of PURIFIED compounds.
#
# SCOPE RULES (applied during curation and enforced by compounds/curation.py):
#   * primary studies only -- reviews are pointers, never evidence;
#   * the PURIFIED compound, not an extract or fraction. A study that dosed an extract is
#     recorded with purified_compound: false and counts_for_score: false;
#   * UV (UVA/UVB/UVC) and visible light are NOT ionising radiation and never qualify as
#     L3. Many hits for the flavonoids are UV-photoprotection studies; they are excluded;
#   * nanoparticle, metal-conjugate and liposomal formulations are excluded: the carrier
#     confounds the compound;
#   * chemical identity is policed. Caffeic acid phenethyl ester (CAPE) is not caffeic
#     acid; alpha-tocopherol succinate is not alpha-tocopherol; nitro-oleic acid is not
#     oleic acid. Derivative-only evidence is never credited to the parent compound;
#   * radioprotection and radiosensitisation are never merged, and the direction always
#     names the cell type (normal or tumour).
#
#   evidence_level  L3_radiation  purified compound + ionising radiation + a
#                                 radiation-response endpoint
#                   L2_process    purified compound modulating a relevant process, no
#                                 ionising radiation
#                   L1_indirect   recorded for transparency only; never scored
#   direction       radioprotection_normal | radioprotection_tumour (LIABILITY) |
#                   radiosensitisation_tumour | no_effect | mixed |
#                   process_modulation_no_radiation | genotoxic (LIABILITY)
#
# Fields absent from the source are null. "NOT STATED" gaps are real gaps in the
# published abstract, never filled in by inference. genes_measured lists ONLY symbols the
# cited paper actually reports as measured; a paper naming pathways but no individual
# proteins has an empty list.
#
# Reading depth is abstract-level throughout unless marked full_text; the concentrations
# and radiation doses missing below must be recovered from full texts before publication
# (docs/compound_evidence_curation.md, open item 3).
#
# Curation: literature-reviewer agent, 2026-10-22. Retracted work is excluded: Giacoppo
# et al. 2017 (PMID 28705212) is flagged retracted in Europe PMC and is not used.

curation_record: "docs/compound_evidence_curation.md (searches, exclusions, open items)"
curated_on: "2026-10-22"
curated_by: "literature-reviewer agent (searching and reading only); recorded by Claude Code"

