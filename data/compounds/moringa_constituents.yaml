    chemical_class: "Glucosinolate-derived isothiocyanate"
    plant_part: both
    extraction_category: seed_or_leaf_other_solvent
    identity_caveat: >
      Several PubChem records differ in stereochemistry (CIDs 12002975, 44198764, and
      14865502 with none); CID 153557 is used here. Moringin is formed from glucomoringin
      by myrosinase when tissue is disrupted, so its presence depends on how the extract
      was prepared rather than on the intact plant alone.
    notes: >
      The isothiocyanate most characteristic of Moringa. No primary study has combined
      purified moringin with ionising radiation (see compound_biology_evidence.yaml), so it
      cannot be scored on radiation biology however chemically distinctive it is.
