    molecular_formula: "C16H23NO6S"
    identifier_verified_via: pubchem
    chemical_class: "Thiocarbamate glycoside (rhamnoside)"
    plant_part: both
    extraction_category: dcm_documented
    identity_caveat: >
      CID 10247749 carries the defined alpha-L-rhamnopyranosyl stereochemistry and is used
      here. A name search also returns CID 5471459 (InChIKey
      JOSHUAQJVMGTGS-UHFFFAOYSA-N), which has no stereochemistry. Abdelsayed et al.
      assigned an (E) thiocarbamate configuration, so the double-bond geometry is a further
      caveat not captured by either record.
    notes: >
      The only constituent in this inventory with a structurally confirmed identification
      in a dichloromethane fraction of BOTH seed and leaf, which makes it the compound most
      directly connected to the extraction solvent of the motivating study.
    reports:
      - citation: >
          Abdelsayed EM, Abdel Motaal A, Hanafi RS. Novel UPLC-MS/MS method for
          standardization of niazimicin content in edible seeds and leaves of Moringa
          oleifera. Journal of Food and Drug Analysis 2021;29(1):128-143.
        doi: "10.38212/2224-6614.3282"
        pmid: "35696224"
        doi_verified_via: europepmc
        reading_depth: full_text
        is_review: false
        plant_part: both
        solvent_or_fraction: >
          Methylene chloride (CH2Cl2) partition fraction of a 70% ethanol maceration of
          seeds and of leaves (liquid-liquid partition: petroleum ether, methylene
          chloride, ethyl acetate, n-butanol)
        identification_method: >
          Reference standard isolated from the seed methylene-chloride fraction by silica
          column chromatography (reported purity 96.6% by PDA); identity confirmed by
          HRMS, UV, IR, EI-MS and 1D/2D NMR; quantified by validated UPLC-MS/MS in MRM
          mode (358 -> 107) with a desipramine internal standard
        identification_strength: isolation_nmr
        is_dcm: true
        research_group: "Hanafi / Abdel Motaal (Cairo)"
        quoted_wording: >
          Niazimicin was quantified in the seed CH2Cl2 fraction and in the leaf CH2Cl2
          fraction. Niazirin and glucomoringin were not identified in this work.
      - citation: >
          Abdelsayed EM, Medhat D, Mandour YM, Hanafi RS, Motaal AA. Niazimicin: a
          thiocarbamate glycoside from Moringa oleifera Lam. seeds with a novel
          neuroprotective activity. Journal of Food Biochemistry 2021;45(12):e13992.
