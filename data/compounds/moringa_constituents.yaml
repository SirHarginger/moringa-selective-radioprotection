# Curated inventory of Moringa oleifera seed and leaf constituents.
#
# PURPOSE. The motivating manuscript tested crude DICHLOROMETHANE (DCM) seed and leaf
# extracts and never characterised them chemically. This file records, for each compound,
# what the published analytical literature actually documents, and in WHICH solvent.
#
# HOW TO READ IT.
#   extraction_category   dcm_documented              identified in a DCM extract/fraction
#                                                     of Moringa SEED or LEAF
#                         seed_or_leaf_other_solvent  primary analytical evidence in seed or
#                                                     leaf, but not in DCM
#                         indirect_or_unconfirmed     review-only, tentative, or another part
#   identification_strength  isolation_nmr | reference_standard | library_match_only |
#                            not_stated  -- what the CITED SOURCE states, verbatim where given
#   reading_depth            abstract | full_text  -- how deeply that source was read here
#   research_group           corresponding-author group; several papers from one group count
#                            as ONE independent source (see compounds/ranking.py D3)
#
# A compound in this file is NOT asserted to be present in the investigator's own extracts.
# No concentration, yield or extract composition is inferred anywhere.
#
# IDENTIFIERS. Every PubChem CID and InChIKey below was fetched from PubChem PUG-REST
# during curation (2026-10-22). Where several stereochemical or salt records exist, the
# chosen record is named and the ambiguity is written into identity_caveat.
#
# Curation: literature-reviewer agent, 2026-10-22; searches and unresolved gaps in
# docs/compound_evidence_curation.md. Reviews were used only as pointers, never as evidence.

curation_record: "docs/compound_evidence_curation.md (searches, verification routes, gaps)"
curated_on: "2026-10-22"
curated_by: "literature-reviewer agent (searching and reading only); recorded by Claude Code"

