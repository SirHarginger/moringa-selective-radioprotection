endpoint:
  endpoint_class: clonogenic_sf
  definition: >
    Literature-derived clonogenic radiosensitivity: per-cell-line median of
    published SF2 values (photon irradiation, clonogenic assay). Studies using
    concomitant reagents, plasmids or siRNAs with radiation were excluded (paper Methods).
  assay: clonogenic survival (as reported by the source studies)
  dose_gy: 2
  radiation_type: photon
  time_point: null
  replicate_structure: >
    UNKNOWN: whether the median is across studies or across individual values,
    and how many values contribute per cell line, are not stated.
known_missingness: >
  Phase_01 descriptive check (Claude Code, 2026-10-21; grep/cut/sort/uniq on the unchanged raw file):
  0 blank mSF2 cells; 0 non-numeric mSF2 cells; every row has exactly 3 fields. No outcome
  summary statistics were computed (by design; statistical-reviewer SR-08).
