# Conda environment for Explainable Radiosensitivity ML.
# Phase 00: environment renamed from "moringa-rad" (docs/decision_log.md D00.12).
# Versions are NOT pinned and no lockfile exists yet. Pinning waits for the
# environment review (docs/decision_log.md P00.02, P00.03).
# Packages marked LEGACY were added for the historical NCI-60 compound-potency
# prototype and have no documented need in the current study design. They are
# kept until the investigator approves their removal.
name: explainable-radiosensitivity-ml

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn      # primary plotting interface for the report figures (D05.02);
                 # matplotlib stays underneath for layout and file export
  - pyarrow
  - pyyamlcd /srv/trustora/projects/fraud-detection-ai

PYTHONPATH=src .venv-validation/bin/python \
  scripts/run_party_continuity_check.py \
  --curated-root data/processed/curated/cash_transactions \
  --party-key-file ~/.trustora/anomaly_party.key \
  --start 2026-02-01 \
  --end 2026-04-30 \
  --focus-start 2026-04-17 \
  --focus-end 2026-04-30 \
  --statement "Q4 C1 continuity check; authorised by <owner>, <date>, reference <approval-id>"
  - requests     # LEGACY (prototype download scripts) - removal proposed
  - tqdm         # LEGACY (prototype progress bars) - removal proposed
  - joblib
  - rdkit        # LEGACY (prototype chemical fingerprints) - removal proposed
  - xgboost      # LEGACY (prototype benchmark) - not justified before docs/protocol.md
  - openpyxl     # LEGACY (prototype spreadsheet input) - removal proposed
  - pytest
  - ruff
